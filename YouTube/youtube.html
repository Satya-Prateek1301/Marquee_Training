    <style>

        *{

            padding:0;

        /* MAIN CONTAINER */
        .main{

        /* LEFT SIDEBAR */
        .left{
            width:15%;
            height:100vh;
            background-color:#f1f1f1;
            display:inline-block;
            vertical-align:top;
            padding:20px;
        }

        /* RIGHT CONTENT */

            display:inline-block;
            vertical-align:top;

        .logo, .input, .create, .bellIcon, .profile{

            vertical-align:middle;
            margin-right:20px;
        }

        .input input{
            width:600px;
            padding:8px;
            border-radius: 15px;
            
        }

        .profile{
            width:35px;
            height:35px;
            background-color:#465A65;
            border-radius:50%;
            text-align: center;
            padding: 6px;
            font-size: 20px;
            color: #FEFEFE;
        }

        .logo img{ 
            width:40px; 
            vertical-align:middle; 
        }

            display: inline-block;
            margin-bottom: 8px;
            font-size:25px; 
            font-weight:bold; 
            margin-top: 10px;

        }

        .logo span{
            vertical-align: middle;
        }

        .mic{

        }

        .create{
            display: inline;
            width: 70px;
            height: 30px;
            background-color: #E5E5E5;
            padding: 7px;
            padding-left: 14px;
            vertical-align: middle;
            border-radius: 8px;
            font-weight: 600;
        }

        .create i{
